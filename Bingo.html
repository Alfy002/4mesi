<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd1e3">
<title>Bingo Napoli 🐥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--pink:#ff8fb8;--pink-d:#e8508a;--pink-l:#ffd9e8;--pink-xl:#fff0f6;--paper:#fff4c2;--paper-d:#f3e08e;--ink:#6b3350;--green:#c9f0d0;--rose:#ffc2cf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);min-height:100vh;
background:radial-gradient(circle at 20% 10%,#fff 0 8%,transparent 9%),radial-gradient(circle at 80% 30%,#fff 0 6%,transparent 7%),radial-gradient(circle at 30% 80%,#fff 0 7%,transparent 8%),linear-gradient(160deg,#ffe3ee,#ffd1e3 55%,#ffc4dc);
background-attachment:fixed;overflow-x:hidden;-webkit-user-select:none;user-select:none}
#app{position:relative;z-index:2;max-width:440px;margin:0 auto;padding:18px 12px 28px}
.sticker{position:fixed;z-index:1;pointer-events:none;font-size:34px;filter:drop-shadow(0 3px 2px rgba(190,60,110,.25));animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(calc(var(--r,0deg) + 6deg))}}
.paper{position:relative;background:var(--paper);border-radius:6px 10px 8px 12px;padding:20px 18px;margin:14px 4px;
box-shadow:0 2px 0 var(--paper-d),0 8px 18px rgba(170,70,110,.25);background-image:repeating-linear-gradient(transparent 0 27px,rgba(232,80,138,.13) 27px 28px)}
.paper.r1{transform:rotate(-1.2deg)}
.paper::before,.tape::before{content:"";position:absolute;top:-11px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,143,184,.55);border-left:2px dotted rgba(255,255,255,.7);border-right:2px dotted rgba(255,255,255,.7)}
h1,h2{font-family:'Pacifico',cursive;font-weight:400;margin:0;color:var(--pink-d);text-align:center}
h1{font-size:34px;line-height:1.15}h2{font-size:22px}
.sub{text-align:center;margin:6px 0 0;font-weight:600}
.stat{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;color:var(--pink-d);box-shadow:0 3px 0 var(--pink-l)}
input[type=text],textarea{font:600 16px 'Quicksand',sans-serif;color:var(--ink);background:#fffdf0;border:2px dashed var(--pink);border-radius:14px;padding:10px 12px;-webkit-user-select:text;user-select:text}
input[type=text]{width:150px;text-align:center}
.msg{text-align:center;font-family:'Pacifico';color:var(--pink-d);font-size:24px;min-height:32px;margin-top:6px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}
.cell{position:relative;aspect-ratio:1;border:0;border-radius:6px 8px 6px 10px;padding:3px;font:700 clamp(8px,2.5vw,11px)/1.1 'Quicksand',sans-serif;color:var(--ink);
display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;cursor:pointer;
box-shadow:0 2px 0 var(--paper-d),0 6px 10px rgba(170,70,110,.28);transition:transform .15s}
.cell:active{transform:scale(.94)!important}
.cell:nth-child(4n+1){background:var(--paper);transform:rotate(-2deg)}
.cell:nth-child(4n+2){background:var(--rose);transform:rotate(1.5deg)}
.cell:nth-child(4n+3){background:#fff;transform:rotate(-1deg)}
.cell:nth-child(4n){background:var(--pink-l);transform:rotate(2deg)}
.cell .n{font:400 17px 'Pacifico',cursive;color:var(--pink-d)}
.cell>*{position:relative}
.cell .th{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.4}
.cell.done{background:var(--green)!important;outline:2px solid #6cc27f}
.cell .ck{position:absolute;top:0;right:2px;font-size:14px}
.cell.line{outline:3px solid var(--pink-d);animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:13px 18px;margin-top:12px;font:700 17px 'Quicksand',sans-serif;color:#fff;
background:linear-gradient(180deg,var(--pink),var(--pink-d));box-shadow:0 4px 0 #b83a6c,0 8px 14px rgba(180,50,100,.3);cursor:pointer;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b83a6c}
.btn.ghost{background:#fff;color:var(--pink-d);box-shadow:0 4px 0 var(--pink-l)}
.btn.ok{background:linear-gradient(180deg,#7fd494,#3fa65c);box-shadow:0 4px 0 #2d7f45,0 8px 14px rgba(40,120,70,.3)}
#ov{position:fixed;inset:0;z-index:20;background:rgba(120,40,80,.4);display:none;align-items:center;justify-content:center;padding:14px;overflow:auto}
#ov.on{display:flex}
.modal{width:100%;max-width:420px;margin:0;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal .m{font-size:18px;font-weight:700;line-height:1.3;text-align:center;margin:10px 0}
.up{display:flex;gap:10px}
.up .btn{margin-top:12px;text-align:center;flex:1;padding:13px 8px}
.up1{background:linear-gradient(180deg,#ffb3d0,#ff6fa5)}
.up2{background:linear-gradient(180deg,#ffc98a,#ff9a4d);box-shadow:0 4px 0 #c76a22,0 8px 14px rgba(200,110,40,.3)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:14px}
.photo{background:#fff;padding:6px 6px 22px;border-radius:4px;box-shadow:0 6px 14px rgba(120,50,80,.3);transform:rotate(-2deg);position:relative}
.photo:nth-child(even){transform:rotate(2deg)}
.photo img{width:100%;display:block;border-radius:2px}
.photo::after{content:"💕";position:absolute;right:6px;bottom:1px;font-size:16px}
.camov{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.camov video{flex:1;min-height:0;width:100%;object-fit:cover}
.camb{display:flex;align-items:center;justify-content:space-around;padding:18px 10px calc(18px + env(safe-area-inset-bottom,0px));background:rgba(60,15,40,.85)}
.camb button{border:0;cursor:pointer;font:700 22px 'Quicksand',sans-serif}
.camb .cx,.camb .flip{width:52px;height:52px;border-radius:50%;background:#fff;color:var(--pink-d)}
.camb .shot{width:76px;height:76px;border-radius:50%;background:var(--pink);border:5px solid #fff;box-shadow:0 0 0 3px var(--pink-d)}
.camb .shot:active{transform:scale(.92)}
.cnt{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);color:var(--pink-d);font:700 16px 'Quicksand',sans-serif;padding:6px 14px;border-radius:999px}
.x{position:absolute;top:-9px;right:-9px;z-index:2;width:28px;height:28px;border:0;border-radius:50%;background:var(--pink-d);color:#fff;font:700 14px/28px 'Quicksand',sans-serif;padding:0;cursor:pointer;box-shadow:0 2px 6px rgba(120,30,70,.4)}
</style>
</head>
<body>
<span class="sticker" style="top:6%;left:3%;--r:-10deg">🌸</span>
<span class="sticker" style="top:12%;right:4%;font-size:40px;--r:8deg;animation-delay:-2s">🐥</span>
<span class="sticker" style="top:34%;left:1%;--r:6deg;animation-delay:-1s">🌷</span>
<span class="sticker" style="top:46%;right:1%;--r:-8deg;animation-delay:-3s">🐣</span>
<span class="sticker" style="top:64%;left:3%;font-size:30px;--r:10deg;animation-delay:-4s">💗</span>
<span class="sticker" style="top:78%;right:3%;font-size:38px;--r:-6deg;animation-delay:-2.5s">🌼</span>
<span class="sticker" style="bottom:3%;left:10%;--r:4deg;animation-delay:-5s">🦋</span>
<span class="sticker" style="bottom:2%;right:14%;font-size:30px;--r:-12deg;animation-delay:-1.5s">🎀</span>
<div id="app">
<div class="paper r1">
<h1>Bingo Napoli 🐥</h1>
<p class="sub">Tocca un post-it e completa la missione!</p>
<div class="stat"><input type="text" id="name" placeholder="Il tuo nome" maxlength="20" aria-label="Il tuo nome"><span class="pill" id="count"></span></div>
</div>
<div class="msg" id="msg"></div>
<div id="grid"></div>
<button class="btn ghost" id="reset">🗑️ Azzera tutto</button>
</div>
<div id="ov"><div class="paper modal" id="modal"></div></div>
<script>
var M=[
["Caccia al teschio","Fotografare un teschio trovato per strada."],
["Numero misterioso","Fotografare un numero di 4 cifre tutte diverse."],
["Oggetto alieno","Trovare l’oggetto più assurdo della giornata."],
["Caccia all’errore","Trovare un errore grammaticale o ortografico su un’insegna."],
["Il dettaglio nascosto","Scoprire un dettaglio curioso di un edificio che l’altro non aveva notato."],
["Il pranzo perfetto","Comporre il miglior pranzo completo per l’altro con un budget massimo di 20€."],
["Il prezzo impossibile","Trovare un oggetto in vendita a un prezzo particolarmente assurdo."],
["Il simbolo misterioso","Fotografare un simbolo o un disegno di cui non conoscete il significato."],
["La vetrina più strana","Trovare la vetrina più bizzarra di Napoli."],
["La contrattazione","Convincere un venditore a includere qualcosa gratuitamente."],
["Il reperto storico","Trovare un oggetto o una scritta che sembri appartenere a un’altra epoca."],
["La copertina","Scattare all’altro una foto che potrebbe essere la copertina di una rivista."],
["L’oggetto fuori contesto","Fotografare qualcosa che non dovrebbe assolutamente trovarsi in quel posto."],
["La prospettiva impossibile","Scattare una foto che, grazie alla prospettiva, crei un’illusione ottica."],
["Il sosia","Trovare una statua, un poster o un’immagine che somigli all’altro."],
["La scritta assurda","Fotografare una frase particolarmente divertente trovata per strada."],
["La porta misteriosa","Trovare una porta particolarmente insolita o decorata."],
["La scena cinematografica","Ricreare una scena famosa di un film utilizzando lo scenario circostante."],
["Caccia all’insegna","Fotografare un’insegna con un nome particolarmente strano o divertente."],
["Il dettaglio in miniatura","Trovare e fotografare una miniatura o una riproduzione inaspettata."],
["Il doppione","Trovare due oggetti apparentemente identici in due posti diversi."],
["La foto impossibile","Fotografare un riflesso che sembri un’immagine completamente diversa dalla realtà."],
["Il musicista","Trovare un musicista di strada e farsi dedicare una canzone."],
["Il cartello misterioso","Fotografare un cartello con un messaggio incomprensibile o ambiguo."],
["Il dettaglio napoletano","Trovare qualcosa che rappresenti Napoli in modo insolito, diverso dai classici souvenir."]
];
var KEY="bingoNapoliPostit",S={name:"",items:{}};
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
for(var k in S.items){var q=S.items[k];if(q.photo){q.photos=(q.photos||[]).concat([q.photo]);delete q.photo}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){alert("Memoria piena: prova con meno foto 🐥");return false}}
var $=function(i){return document.getElementById(i)};
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var LINES=[];for(var a=0;a<5;a++){var rr=[],cc=[];for(var b=0;b<5;b++){rr.push(a*5+b);cc.push(b*5+a)}LINES.push(rr,cc)}
LINES.push([0,6,12,18,24],[4,8,12,16,20]);
function draw(){
var g=$("grid");g.innerHTML="";var done=0,inLine={},bingos=0;
LINES.forEach(function(l){if(l.every(function(i){return S.items[i]&&S.items[i].done})){bingos++;l.forEach(function(i){inLine[i]=1})}});
M.forEach(function(m,i){
var it=S.items[i]||{},c=document.createElement("button");
c.className="cell"+(it.done?" done":"")+(inLine[i]?" line":"");
if(it.done)done++;
c.innerHTML=(it.photos&&it.photos.length?'<div class="th" style="background-image:url('+it.photos[0]+')"></div>':"")+(it.done?'<span class="ck">✅</span>':"")+'<span class="n">'+(i+1)+'</span><span>'+m[0]+'</span>';
c.onclick=function(){openM(i)};g.appendChild(c)});
$("count").textContent="✅ "+done+" / 25";
$("msg").textContent=bingos?"🎉 Bingo"+(bingos>1?" x"+bingos:"")+"! 🎉":"";
}
function openM(i){
var o=S.items[i]||(S.items[i]={}),mo=$("modal");
if(!o.photos)o.photos=[];
function shrink(f,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){
var k=Math.min(1,640/Math.max(im.width,im.height)),cv=document.createElement("canvas");
cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
cb(cv.toDataURL("image/jpeg",.65))};im.src=fr.result};fr.readAsDataURL(f)}
function add(files){var n=files.length;if(!n)return;
Array.prototype.forEach.call(files,function(f){shrink(f,function(d){o.photos.push(d);if(--n===0){save();render();draw()}})})}
function camera(){
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert("Fotocamera non disponibile qui: usa Carica 📁");return}
var face="environment",st=null,cv=document.createElement("div");
cv.className="camov";
cv.innerHTML='<div class="cnt">📸 '+o.photos.length+'</div><video playsinline autoplay muted></video><div class="camb"><button class="cx" aria-label="Chiudi">✕</button><button class="shot" aria-label="Scatta"></button><button class="flip" aria-label="Gira">🔄</button></div>';
document.body.appendChild(cv);
var v=cv.querySelector("video");
function stop(){if(st)st.getTracks().forEach(function(t){t.stop()});st=null}
function close(){stop();cv.remove()}
function start(){stop();navigator.mediaDevices.getUserMedia({video:{facingMode:face,width:{ideal:1280}},audio:false}).then(function(s){st=s;v.srcObject=s}).catch(function(){close();alert("Non riesco ad aprire la fotocamera. Controlla i permessi o usa Carica 📁")})}
cv.querySelector(".cx").onclick=close;
cv.querySelector(".flip").onclick=function(){face=face==="environment"?"user":"environment";start()};
cv.querySelector(".shot").onclick=function(){if(!v.videoWidth)return;
var k=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement("canvas");
c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext("2d").drawImage(v,0,0,c.width,c.height);
o.photos.push(c.toDataURL("image/jpeg",.65));save();render();draw();
cv.querySelector(".cnt").textContent="📸 "+o.photos.length};
start();
}
function render(){
mo.innerHTML='<h2>'+(i+1)+'. '+esc(M[i][0])+'</h2><div class="m">'+esc(M[i][1])+'</div>'+
'<div class="up"><label class="btn up1">📁 Carica<input type="file" id="f1" accept="image/*" multiple hidden></label>'+
'<button class="btn up2" id="cam">📷 Foto</button></div>'+
'<div class="photos">'+o.photos.map(function(p,k){return '<div class="photo"><button class="x" data-k="'+k+'" aria-label="Elimina foto">✕</button><img src="'+p+'" alt="foto"></div>'}).join("")+'</div>'+
'<button class="btn ok" id="dn">'+(o.done?"↩️ Segna da fare":"✅ Missione completata")+'</button>'+
'<button class="btn ghost" id="cl">Chiudi</button>';
$("f1").onchange=function(e){add(e.target.files)};
$("cam").onclick=camera;
Array.prototype.forEach.call(mo.querySelectorAll(".x"),function(b){b.onclick=function(){o.photos.splice(+b.getAttribute("data-k"),1);save();render();draw()}});
$("dn").onclick=function(){o.done=!o.done;save();$("ov").classList.remove("on");draw()};
$("cl").onclick=function(){$("ov").classList.remove("on");draw()};
}
render();
$("ov").classList.add("on");
}
$("ov").onclick=function(e){if(e.target===$("ov"))$("ov").classList.remove("on")};
$("name").value=S.name||"";
$("name").oninput=function(){S.name=this.value;save()};
$("reset").onclick=function(){if(confirm("Cancellare tutte le missioni salvate?")){S.items={};save();draw()}};
draw();
</script>
</body>
</html>
